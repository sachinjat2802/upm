name: UPM Polyglot CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  polyglot-check:
    name: UPM Polyglot Dependency Audit & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache UPM Global Store
        uses: actions/cache@v4
        with:
          path: ~/.upm/cache
          key: ${{ runner.os }}-upm-${{ hashFiles('**/upm.toml') }}

      - name: Build UPM Executable
        run: cargo build --release --bin upm

      - name: Run UPM Doctor Diagnostics
        run: ./target/release/upm doctor

      - name: Scan Secrets & Compliance Policies
        run: |
          ./target/release/upm scan-secrets
          ./target/release/upm policy
          ./target/release/upm licenses

      - name: Run Cargo Unit Tests
        run: cargo test
