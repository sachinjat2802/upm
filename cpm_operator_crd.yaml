apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cpmworkspaces.cpm.io
spec:
  group: cpm.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                ecosystems:
                  type: array
                  items:
                    type: string
                replicas:
                  type: integer
  scope: Namespaced
  names:
    plural: cpmworkspaces
    singular: cpmworkspace
    kind: CpmWorkspace
    shortNames:
      - cpmws
