[package]
name = "upm"
version = "0.1.0"
edition = "2021"
authors = ["UPM Contributors"]
description = "Universal Package Platform — Write in one language. Depend on all of them."
default-run = "upm"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["package-manager", "polyglot", "cross-language", "rpc", "bridge"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "upm"
path = "src/main.rs"

[[bin]]
name = "cpm"
path = "src/cpm_main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive", "env", "color"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tokio = { version = "1.35", features = ["full"] }
tabled = "0.15"
colored = "2.1"
anyhow = "1.0"
thiserror = "1.0"
glob = "0.3"
async-trait = "0.1"
uuid = { version = "1.6", features = ["v4", "serde"] }
base64 = "0.22"

[dev-dependencies]
tempfile = "3.8"
